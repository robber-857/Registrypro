<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Registrypro ASIC</title><style>body{font:14px system-ui;width:340px;padding:16px;color:#243248}h1{font-size:19px}label{display:block;margin:12px 0}input,select{box-sizing:border-box;width:100%;padding:9px;margin-top:5px}button{padding:10px;border:0;background:#2456c5;color:white;border-radius:4px;cursor:pointer;margin-right:5px}p{line-height:1.6;color:#586579}#status{white-space:pre-wrap}</style></head><body>
<h1>ASIC 自动核对 · 2.4</h1><p>保持本机系统运行。从系统的“ASIC 浏览器插件”区域复制配对码，首次使用粘贴到这里。</p>
<label>本机配对码<input id="token" type="password" autocomplete="off"></label>
<label>名单<select id="scope"><option value="manual">最近一次查询</option><option value="reviewed">Burwood 初始名单</option><option value="automation">连续任务当前邮编</option></select></label>
<label>查询间隔<select id="delay"><option value="5">5 秒</option><option value="15" selected>15 秒</option><option value="30">30 秒</option><option value="60">1 分钟</option></select></label>
<label><input id="follow" type="checkbox" style="width:auto"> 等待系统连续邮编队列（先连接，再启动邮编任务）</label><label><input id="refresh" type="checkbox" style="width:auto"> 强制刷新 ASIC 日期（忽略 24 小时缓存）</label><label><input id="company" type="checkbox" style="width:auto"> 额外查询公司年度审核日</label><button id="start">连接并开始</button><button id="pause">暂停</button><button id="resume">继续</button>
<button id="enableocr">启用本次截图 OCR 备用</button><button id="reload">加载本机更新</button><p id="status" role="status">准备就绪</p><p>仅查询免费公开摘要，不购买报告。遇到验证提示时等待，正常页面稳定恢复后自动继续；不会点击或处理验证码。手动暂停需手动继续。结果自动保存至本机名单。</p>
<script src="popup.js"></script></body></html>
